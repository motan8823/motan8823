<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile | 森颯詩</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
    color:#111;
    background:#fff;
}

/* ナビ */

nav{
    position:fixed;
    top:40px;
    right:50px;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:20px;
    z-index:999;
}

nav a{
    color:#111;
    text-decoration:none;
    font-size:20px;
    font-weight:300;
    letter-spacing:.15em;
    transition:.25s;
}

nav a:hover{
    color:#ff0088;
    transform:translateX(-8px);
}

nav a.active{
    color:#ff0088;
}

/* 全体 */

.container{
    max-width:900px;
    margin:auto;
    padding:40px 30px 80px;
}

/* 上画像 */

.hero-wrap{
    width:100%;
    overflow:hidden;
    clip-path:circle(0% at 50% 50%);
    animation:heroReveal 1.6s cubic-bezier(.75,0,.2,1) forwards;
}

.hero{
    width:100%;
    display:block;
    transform:scale(1.12);
    animation:heroZoom 1.6s cubic-bezier(.75,0,.2,1) forwards;
}

@keyframes heroReveal{

    0%{
        clip-path:circle(0% at 50% 50%);
    }

    15%{
        clip-path:circle(4% at 50% 50%);
    }

    35%{
        clip-path:circle(12% at 50% 50%);
    }

    65%{
        clip-path:circle(45% at 50% 50%);
    }

    100%{
        clip-path:circle(75% at 50% 50%);
    }

}

@keyframes heroZoom{

    from{
        transform:scale(1.12);
    }

    to{
        transform:scale(1);
    }

}

/* キャッチ */

.catch{

    max-width:700px;
    margin:60px auto 0;

    font-size:54px;
    line-height:1.55;
    font-weight:400;

    text-align:left;

    opacity:0;
    transform:translateY(20px);

    animation:catchFade .8s ease .9s forwards;

}

@keyframes catchFade{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* プロフィール */

.profile{

    margin-top:90px;
    max-width:700px;

}

.profile h1{

    font-size:54px;
    font-weight:500;
    margin-bottom:10px;

}

.profile ruby rt{

    font-size:14px;
    color:#111;
    font-weight:500;
    transform:translateY(4px);

}

.profile p{

    margin-top:28px;
    font-size:18px;
    line-height:1.65;

}

footer{

    margin-top:140px;
    text-align:center;
    color:#777;
    font-size:14px;
    padding-bottom:40px;

}

@media(max-width:768px){

    nav{
        top:25px;
        right:25px;
        gap:14px;
    }

    nav a{
        font-size:16px;
    }

    .container{
        padding:25px;
    }

    .catch{
        font-size:34px;
        max-width:100%;
    }

    .profile h1{
        font-size:40px;
    }

    .profile p{
        font-size:16px;
    }

}

</style>

</head>

<body>

<nav>
    <a href="design.html">design</a>
    <a href="art.html">art</a>
    <a href="profile.html" class="active">profile</a>
    <a href="contact.html">contact</a>
</nav>

<div class="container">

    <div class="hero-wrap">
        <img src="profile-top.jpg" class="hero" alt="Profile Image">
    </div>

    <div class="catch">
        幾通りもの世界を創造し、<br>
        世の中にエンタメと啓発を届ける。
    </div>

    <div class="profile">

        <h1>
            森
            <ruby>颯<rt>そう</rt></ruby><ruby>詩<rt>し</rt></ruby>
        </h1>

        <p>
1998.08.22 京都生まれ／大阪市内在住<br><br>

東山高等学校 卒業<br>

        </p>

    </div>

</div>

<footer>

</footer>

</body>
</html>
