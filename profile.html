<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile | 森颯詩</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
    background:#fff;
    color:#111;
}

/* ==========================
   Navigation
========================== */

nav{

    position:fixed;
    top:40px;
    right:50px;

    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:20px;

    z-index:999;

}

nav a{

    color:#111;
    text-decoration:none;
    font-size:20px;
    font-weight:300;
    letter-spacing:.15em;

    transition:.25s;

}

nav a:hover{

    color:#ff0088;
    transform:translateX(-8px);

}

nav a.active{

    color:#ff0088;

}

/* ==========================
   Layout
========================== */

.container{

    width:min(900px,90vw);

    margin:auto;

    padding-top:50px;
    padding-bottom:120px;

}

/* ==========================
   Hero
========================== */

.hero-wrap{

    overflow:hidden;
    border-radius:2px;

    opacity:0;
    transform:translateY(24px) scale(1.03);

    animation:heroAppear 1.2s cubic-bezier(.2,.8,.2,1) forwards;

}

.hero{

    width:100%;
    display:block;

}

@keyframes heroAppear{

    to{

        opacity:1;
        transform:translateY(0) scale(1);

    }

}

/* ==========================
   Catch
========================== */

.catch{

    margin-top:72px;

    text-align:center;

    font-size:48px;
    font-weight:400;
    line-height:1.55;

    letter-spacing:.02em;

    opacity:0;
    transform:translateY(20px);

    animation:fadeUp .8s ease .5s forwards;

}

/* ==========================
   Profile
========================== */

.profile{

    width:520px;

    margin:110px auto 0;

}

.profile h1{

    text-align:center;

    font-size:58px;
    font-weight:500;

    margin-bottom:18px;

}

.profile ruby{

    ruby-align:center;

}

.profile ruby rt{

    font-size:12px;
    color:#111;
    font-weight:500;

    transform:translateY(5px);

}

.profile .info{

    text-align:center;

    font-size:18px;

    margin-bottom:70px;

}

.profile p{

    font-size:17px;
    line-height:1.95;

    font-weight:300;

}

@keyframes fadeUp{

    from{

        opacity:0;
        transform:translateY(20px);

    }

    to{

        opacity:1;
        transform:translateY(0);

    }

}
    @media(max-width:768px){

    nav{

        top:25px;
        right:25px;
        gap:14px;

    }

    nav a{

        font-size:16px;

    }

    .container{

        width:90vw;
        padding-top:30px;

    }

    .catch{

        font-size:34px;
        margin-top:48px;

    }

    .profile{

        width:100%;
        margin-top:80px;

    }

    .profile h1{

        font-size:42px;

    }

    .profile .info{

        font-size:16px;
        margin-bottom:50px;

    }

    .profile p{

        font-size:16px;

    }

}

footer{

    margin-top:160px;

    text-align:center;

    font-size:14px;
    color:#777;

}

</style>

</head>

<body>

<nav>

    <a href="design.html">design</a>
    <a href="art.html">art</a>
    <a href="profile.html" class="active">profile</a>

</nav>

    <div class="hero-wrap">

        <img src="profile-top.jpg" class="hero" alt="Profile Image">

    </div>

    <div class="catch">

        幾通りもの世界を創造し、<br>
        世の中にエンタメと啓発を届ける。

    </div>

    <div class="profile">

        <h1>

            森
            <ruby>颯<rt>そう</rt></ruby><ruby>詩<rt>し</rt></ruby>

        </h1>

        <div class="info">

            1998.08.22 京都生まれ／大阪市内在住

        </div>

        <p>

東山高等学校 卒業<br>
京都芸術大学 卒業（旧 京都造形芸術大学）<br>

        </p>

    </div>

</div>

</body>
</html>
