<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile | 森颯詩</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
    color:#111;
    background:#fff;
}

/* ---------- Navigation ---------- */

nav{
    position:fixed;
    top:40px;
    right:50px;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:20px;
    z-index:999;
}

nav a{
    color:#111;
    text-decoration:none;
    font-size:20px;
    font-weight:300;
    letter-spacing:.15em;
    transition:.25s;
}

nav a:hover{
    color:#ff0088;
    transform:translateX(-8px);
}

nav a.active{
    color:#ff0088;
}

/* ---------- Layout ---------- */

.container{

    width:min(980px,92vw);

    margin:0 auto;

    padding:48px 0 120px;

}

/* ---------- Hero ---------- */

.hero-wrap{

    width:80%;
    margin:0 auto;

    overflow:hidden;

    clip-path:circle(0% at 50% 50%);
    animation:heroReveal 1.6s cubic-bezier(.75,0,.2,1) forwards;

}

.hero{

    width:100%;
    display:block;

    transform:scale(1.12);
    animation:heroZoom 1.6s cubic-bezier(.75,0,.2,1) forwards;

}

@keyframes heroReveal{

    0%{
        clip-path:circle(0% at 50% 50%);
    }

    15%{
        clip-path:circle(4% at 50% 50%);
    }

    35%{
        clip-path:circle(12% at 50% 50%);
    }

    65%{
        clip-path:circle(45% at 50% 50%);
    }

    100%{
        clip-path:circle(75% at 50% 50%);
    }

}

@keyframes heroZoom{

    from{
        transform:scale(1.12);
    }

    to{
        transform:scale(1);
    }

}

/* ---------- Catch ---------- */

.catch{

    margin-top:58px;

    text-align:center;

    font-size:52px;
    font-weight:400;
    line-height:1.55;
    letter-spacing:.01em;

    opacity:0;
    transform:translateY(20px);

    animation:catchFade .8s ease .9s forwards;

}

@keyframes catchFade{

    from{

        opacity:0;
        transform:translateY(20px);

    }

    to{

        opacity:1;
        transform:translateY(0);

    }

}
