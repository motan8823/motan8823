<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile | 森颯詩</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
    color:#111;
    background:#fff;
}

/* ---------- Navigation ---------- */

nav{
    position:fixed;
    top:40px;
    right:50px;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:20px;
    z-index:999;
}

nav a{
    color:#111;
    text-decoration:none;
    font-size:20px;
    font-weight:300;
    letter-spacing:.15em;
    transition:.25s;
}

nav a:hover{
    color:#ff0088;
    transform:translateX(-8px);
}

nav a.active{
    color:#ff0088;
}

/* ---------- Layout ---------- */

.container{
    width:min(980px,92vw);
    margin:0 auto;
    padding:48px 0 120px;
}

/* ---------- Hero ---------- */

.hero-wrap{
    width:80%;
    margin:0 auto;
    overflow:hidden;

    clip-path:circle(0% at 50% 50%);
    animation:heroReveal 1.6s cubic-bezier(.75,0,.2,1) forwards;
}

.hero{
    width:100%;
    display:block;

    transform:scale(1.12);
    animation:heroZoom 1.6s cubic-bezier(.75,0,.2,1) forwards;
}

@keyframes heroReveal{
    0%{clip-path:circle(0% at 50% 50%);}
    15%{clip-path:circle(4% at 50% 50%);}
    35%{clip-path:circle(12% at 50% 50%);}
    65%{clip-path:circle(45% at 50% 50%);}
    100%{clip-path:circle(75% at 50% 50%);}
}

@keyframes heroZoom{
    from{transform:scale(1.12);}
    to{transform:scale(1);}
}

/* ---------- Catch ---------- */

.catch{
    margin-top:58px;
    text-align:center;
    font-size:42px;
    font-weight:400;
    line-height:1.55;
    opacity:0;
    transform:translateY(20px);
    animation:catchFade .8s ease .9s forwards;
}

@keyframes catchFade{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ---------- Profile ---------- */

.profile{
    width:min(700px,90vw);
    margin:120px auto 0;
}

.profile h1{
    text-align:center;
    font-size:62px;
    font-weight:500;
    margin-bottom:18px;
}

.profile ruby{
    ruby-align:center;
}

.profile ruby rt{
    font-size:13px;
    font-weight:500;
}

.birth{
    text-align:center;
    font-size:18px;
    font-weight:300;
    margin-bottom:90px;
}

.profile-text{
    width:100%;
}

.profile-text p{
    font-size:17px;
    line-height:1.8;
    font-weight:300;
    text-align:left;
}

.profile-bottom{
    margin-top:60px;
    display:flex;
    justify-content:flex-start;
}

.profile-bottom p{
    width:100%;
    font-size:17px;
    line-height:1.8;
    font-weight:300;
    text-align:left;
}

@media(max-width:768px){

    nav{
        top:25px;
        right:25px;
        gap:14px;
    }

    nav a{
        font-size:16px;
    }

    .container{
        width:92vw;
        padding:32px 0 80px;
    }

    .hero-wrap{
        width:100%;
    }

    .catch{
        font-size:30px;
        margin-top:40px;
    }

    .profile{
        width:100%;
        margin-top:80px;
    }

    .profile h1{
        font-size:44px;
    }

    .birth{
        font-size:16px;
        margin-bottom:60px;
    }

    .profile-bottom{
        margin-top:50px;
    }

    .profile-bottom p{
        width:100%;
    }

}

footer{
    margin-top:160px;
    text-align:center;
    font-size:14px;
    color:#777;
    padding-bottom:40px;
}

</style>

</head>
<body>

<nav>
    <a href="design.html">design</a>
    <a href="art.html">art</a>
    <a href="profile.html" class="active">profile</a>
    <a href="contact.html">contact</a>
</nav>

<div class="container">

    <div class="hero-wrap">
        <img src="profile-top.jpg" class="hero" alt="Profile Image">
    </div>

    <div class="catch">
        幾通りもの世界を創造し、<br>
        世の中にエンタメと啓発を届ける。
    </div>

    <div class="profile">

        <h1>
            森
            <ruby>颯<rt>そう</rt></ruby><ruby>詩<rt>し</rt></ruby>
        </h1>

        <div class="birth">
            1998.08.22　京都生まれ／大阪市内在住
        </div>

        <div class="profile-text">
            <p>
                東山高等学校 卒業<br>
                京都芸術大学 卒業（旧 京都造形芸術大学）<br>
                新卒で大手報道番組のテロップ制作に従事。<br>
                その後、法人営業職へ転職。<br><br>

                現在は会社員として働く傍ら、<br>
                デザイン・アーティスト活動に取り組んでいます。
            </p>
        </div>

        <div class="profile-bottom">
            <p>
                アイデアを形にするところから、<br>
                グラフィックデザインまで<br>
                一貫して手掛けます。
            </p>
        </div>

    </div>

</div>

<footer>
    © 2026 Soshi Mori. All Rights Reserved.
</footer>

</body>
</html>
