<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | 森颯詩</title>


<style>


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;

    background:#fff;
    color:#111;

    overflow:hidden;

    transition:
    background .3s ease,
    color .3s ease;

}



/* =================================================
   Navigation
================================================= */

nav{

    position:fixed;

    top:40px;
    right:50px;

    display:flex;

    flex-direction:column;

    align-items:flex-end;

    gap:20px;

    z-index:9999;

}


nav a{

    color:#111;

    text-decoration:none;

    font-size:20px;

    font-weight:300;

    letter-spacing:.15em;

    transition:
    color .3s ease,
    transform .3s ease;

}


nav a:hover{

    color:#ff0088;

    transform:translateX(-8px);

}


nav a.active{

    color:#ff0088;

}



/* =================================================
   Contact Links
================================================= */

.contact-links{

    position:fixed;

    left:40px;

    bottom:40px;

    display:flex;

    flex-direction:column;

    align-items:flex-start;

    gap:28px;

    z-index:9999;

}


.contact-links a{

    display:inline-block;

    width:max-content;

    color:#111;

    text-decoration:none;

    font-size:84px;

    font-weight:300;

    line-height:.95;

    transition:
    color .3s ease,
    transform .3s ease;

}


.contact-links a:hover{

    color:#ff0088;

    transform:translateX(10px);

}



/* note */

.note-link:hover{

    color:#ff0088 !important;

}



/* mail */

.mail-link:hover{

    color:#ff0088 !important;

}



/* Instagram */

.instagram-link:hover{

    color:#ff0088 !important;

}



/* =================================================
   Instagram Gallery
================================================= */

.instagram-gallery{

    position:fixed;

    inset:0;

    width:100vw;

    height:100vh;

    pointer-events:none;

    z-index:100;

    overflow:hidden;

}


.instagram-gallery img{

    position:absolute;

    display:block;

    object-fit:cover;

    opacity:0;

    pointer-events:none;

    transition:
        transform 1.15s cubic-bezier(.22,1,.36,1),
        opacity .7s ease;

    will-change:transform,opacity;

}



/* =================================================
   画像1：サンダル
   左上から入る
================================================= */

.gallery-sandal{

    width:240px;
    height:240px;

    left:8vw;
    top:8vh;

    transform:
        translate(-130vw,-80vh)
        rotate(-25deg)
        scale(.75);

}



/* =================================================
   画像2：クラゲマン
   右上から入る
================================================= */

.gallery-kurageman{

    width:280px;
    height:280px;

    right:8vw;
    top:12vh;

    transform:
        translate(120vw,-70vh)
        rotate(28deg)
        scale(.75);

}



/* =================================================
   画像3：クラゲ
   左下から入る
================================================= */

.gallery-kurage{

    width:300px;
    height:300px;

    left:18vw;
    bottom:8vh;

    transform:
        translate(-120vw,80vh)
        rotate(24deg)
        scale(.75);

}



/* =================================================
   画像4：貝殻にぎり
   右下から入る
================================================= */

.gallery-kaigara{

    width:260px;
    height:260px;

    right:18vw;
    bottom:10vh;

    transform:
        translate(120vw,80vh)
        rotate(-24deg)
        scale(.75);

}



/* =================================================
   Instagram Hover
================================================= */

body.instagram-active .instagram-gallery img{

    opacity:1;

}



/* -------------------------
   サンダル
------------------------- */

body.instagram-active .gallery-sandal{

    transform:
        translate(0,0)
        rotate(-9deg)
        scale(1);

    transition-delay:.00s;

}



/* -------------------------
   クラゲマン
------------------------- */

body.instagram-active .gallery-kurageman{

    transform:
        translate(0,0)
        rotate(8deg)
        scale(1);

    transition-delay:.08s;

}



/* -------------------------
   クラゲ
------------------------- */

body.instagram-active .gallery-kurage{

    transform:
        translate(0,0)
        rotate(6deg)
        scale(1);

    transition-delay:.16s;

}



/* -------------------------
   貝殻にぎり
------------------------- */

body.instagram-active .gallery-kaigara{

    transform:
        translate(0,0)
        rotate(-7deg)
        scale(1);

    transition-delay:.24s;

}



/* =================================================
   note演出
================================================= */

.note-title{

    position:fixed;

    top:-150px;

    left:-100px;

    font-size:130px;

    font-weight:300;

    letter-spacing:.12em;

    color:#fff;

    opacity:0;

    transition:
    all 1s cubic-bezier(.22,1,.36,1);

    z-index:10000;

}


.note-message{

    position:fixed;

    right:-100px;

    bottom:-300px;

    width:520px;

    font-size:42px;

    font-weight:200;

    line-height:1.8;

    letter-spacing:.12em;

    color:#fff;

    opacity:0;

    transition:
    all 1.2s cubic-bezier(.22,1,.36,1);

    z-index:10000;

}



/* =================================================
   mail演出
================================================= */

.mail-message{

    position:fixed;

    top:50%;

    left:50%;

    transform:translate(-50%,-50%);

    font-size:42px;

    font-weight:300;

    letter-spacing:.1em;

    color:#fff;

    opacity:0;

    transition:.8s ease;

    z-index:10000;

}



/* =================================================
   コピー完了
================================================= */

.copy-message{

    position:fixed;

    top:55%;

    left:50%;

    transform:translateX(-50%);

    font-size:16px;

    letter-spacing:.2em;

    color:#ff0088;

    opacity:0;

    transition:.3s ease;

    z-index:10001;

}


.copy-message.show{

    opacity:1;

}



/* =================================================
   note / mail 背景
================================================= */

body.note-active{

    background:#000;

    color:#fff;

}


body.mail-active{

    background:#000;

    color:#fff;

}


body.note-active nav a,
body.note-active .contact-links a,
body.mail-active nav a,
body.mail-active .contact-links a{

    color:#fff;

}



/* =================================================
   note表示
================================================= */

body.note-active .note-title{

    top:40px;

    left:40px;

    opacity:.85;

}


body.note-active .note-message{

    right:80px;

    bottom:60px;

    opacity:1;

}



/* =================================================
   mail表示
================================================= */

body.mail-active .mail-message{

    opacity:1;

}



/* =================================================
   Mobile
================================================= */

@media(max-width:768px){


    nav{

        top:24px;

        right:24px;

        gap:14px;

    }


    nav a{

        font-size:16px;

    }



    .contact-links{

        left:24px;

        bottom:24px;

        gap:18px;

    }



    .contact-links a{

        font-size:56px;

    }



    .note-title{

        font-size:70px;

    }



    .note-message{

        width:300px;

        font-size:28px;

        right:20px;

    }



    .mail-message{

        font-size:26px;

    }



    body.note-active .note-title{

        top:30px;

        left:20px;

    }



    body.note-active .note-message{

        right:20px;

        bottom:40px;

    }



    /* Instagram画像 */

    .gallery-sandal{

        width:150px;

        height:150px;

        left:5vw;

        top:12vh;

    }


    .gallery-kurageman{

        width:170px;

        height:170px;

        right:5vw;

        top:14vh;

    }


    .gallery-kurage{

        width:180px;

        height:180px;

        left:5vw;

        bottom:18vh;

    }


    .gallery-kaigara{

        width:160px;

        height:160px;

        right:5vw;

        bottom:18vh;

    }


}



/* =================================================
   JavaScriptでInstagramを外した時
   transition-delayを無効化するための設定
================================================= */

.instagram-gallery img{

    transition-property:
        transform,
        opacity;

}



/* =================================================
   JavaScriptで戻る時に遅延をなくす
================================================= */

body:not(.instagram-active) .instagram-gallery img{

    transition-delay:0s;

}


</style>


</head>



<body>



<!-- =================================================
     Navigation
================================================= -->

<nav>

    <a href="design.html">
        design
    </a>


    <a href="art.html">
        art
    </a>


    <a href="profile.html">
        profile
    </a>


    <a href="contact.html" class="active">
        contact
    </a>

</nav>





<!-- =================================================
     Instagram Gallery
================================================= -->

<div class="instagram-gallery">


    <img
        src="サンダル.png"
        class="gallery-sandal"
        alt=""
    >


    <img
        src="クラゲマン.png"
        class="gallery-kurageman"
        alt=""
    >


    <img
        src="クラゲ.png"
        class="gallery-kurage"
        alt=""
    >


    <img
        src="貝殻にぎり.jpg"
        class="gallery-kaigara"
        alt=""
    >


</div>





<!-- =================================================
     Contact Links
================================================= -->

<div class="contact-links">


    <a class="mail-link">

        mail

    </a>



    <a
        class="note-link"
        href="https://note.com/motan_8823"
        target="_blank"
        rel="noopener noreferrer">

        note

    </a>



    <a
        class="instagram-link"
        href="https://www.instagram.com/motan_8823/"
        target="_blank"
        rel="noopener noreferrer">

        instagram

    </a>


</div>





<!-- =================================================
     Note
================================================= -->

<div class="note-title">

    森 颯詩

</div>



<div class="note-message">

    周りを<br>
    経済的にも<br>
    感情的にも<br>
    豊かにできる人が、<br>
    面白い人だと<br>
    思っています。

</div>





<!-- =================================================
     Mail
================================================= -->

<div class="mail-message">

    soshi.tennis@gmail.com

</div>





<!-- =================================================
     Copy
================================================= -->

<div class="copy-message">

    copied

</div>





<script>


/* =================================================
   Elements
================================================= */

const noteLink =
    document.querySelector(".note-link");


const mailLink =
    document.querySelector(".mail-link");


const instagramLink =
    document.querySelector(".instagram-link");


const copyMessage =
    document.querySelector(".copy-message");





/* =================================================
   note
================================================= */

noteLink.addEventListener("mouseenter",()=>{

    document.body.classList.add("note-active");

});


noteLink.addEventListener("mouseleave",()=>{

    document.body.classList.remove("note-active");

});





/* =================================================
   mail
================================================= */

mailLink.addEventListener("mouseenter",()=>{

    document.body.classList.add("mail-active");

});


mailLink.addEventListener("mouseleave",()=>{

    document.body.classList.remove("mail-active");

});





mailLink.addEventListener("click",()=>{


    navigator.clipboard.writeText(
        "soshi.tennis@gmail.com"
    );


    copyMessage.classList.add("show");


    setTimeout(()=>{

        copyMessage.classList.remove("show");

    },1500);


});





/* =================================================
   Instagram
================================================= */

instagramLink.addEventListener("mouseenter",()=>{

    document.body.classList.add("instagram-active");

});


instagramLink.addEventListener("mouseleave",()=>{

    document.body.classList.remove("instagram-active");

});



</script>



</body>

</html>
