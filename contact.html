<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
    background:#fff;
    color:#111;
    overflow:hidden;
}

/* Navigation */
nav{
    position:fixed;
    top:40px;
    right:50px;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:20px;
    z-index:9999;
}

nav a{
    color:#111;
    text-decoration:none;
    font-size:20px;
    font-weight:300;

    transition:color .3s ease, transform .3s ease;
}

nav a:hover{
    color:#ff0088;
    transform:translateX(-8px);
}

nav a.active{
    color:#ff0088;
}

/* Contact Links */
.contact-links{
    position:fixed;
    left:40px;
    bottom:40px;
    display:flex;
    flex-direction:column;
    gap:28px;
}

.contact-links a{
    color:#111;
    text-decoration:none;
    font-size:84px;
    font-weight:300;
    line-height:0.95;
    transition:color .3s ease, transform .3s ease;
}

.contact-links a:hover{
    color:#ff0088;
    transform:translateX(10px);
}

@media(max-width:768px){

    nav{
        top:24px;
        right:24px;
        gap:14px;
    }

    nav a{
        font-size:16px;
    }

    .contact-links{
        left:24px;
