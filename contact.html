<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | 森颯詩</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;

    background:#fff;
    color:#111;

    overflow:hidden;

    transition:
    background .3s ease,
    color .3s ease;

}


/* =================================================
   Navigation
================================================= */

nav{

    position:fixed;

    top:40px;
    right:50px;

    display:flex;

    flex-direction:column;

    align-items:flex-end;

    gap:20px;

    z-index:9999;

}

nav a{

    color:#111;

    text-decoration:none;

    font-size:20px;

    font-weight:300;

    letter-spacing:.15em;

    transition:
    color .3s ease,
    transform .3s ease;

}

nav a:hover{

    color:#ff0088;

    transform:translateX(-8px);

}

nav a.active{

    color:#ff0088;

}


/* =================================================
   Contact Links
================================================= */

.contact-links{

    position:fixed;

    left:40px;
    bottom:40px;

    display:flex;

    flex-direction:column;

    align-items:flex-start;

    gap:28px;

    z-index:9999;

}

.contact-links a{

    display:inline-block;

    width:max-content;

    color:#111;

    text-decoration:none;

    font-size:84px;

    font-weight:300;

    line-height:.95;

    transition:
    color .3s ease,
    transform .3s ease;

}

.contact-links a:hover{

    color:#ff0088;

    transform:translateX(10px);

}


/* =================================================
   Instagram
================================================= */

.instagram-link:hover{

    color:#ff0088 !important;

}


/* =================================================
   Instagram Gallery
================================================= */

.instagram-gallery{

    position:fixed;

    inset:0;

    width:100vw;
    height:100vh;

    pointer-events:none;

    z-index:100;

    overflow:hidden;

}


.instagram-gallery img{

    position:absolute;

    display:block;

    object-fit:cover;

    opacity:0;

    pointer-events:none;

    transition:
        transform 1.15s cubic-bezier(.22,1,.36,1),
        opacity .7s ease;

    will-change:transform,opacity;

}


/* =================================================
   SUPAIDER
   左上から入る
================================================= */

.gallery-supaider{

    width:580px;
    height:580px;

    left:3vw;
    top:3vh;

    transform:
        translate(-130vw,-80vh)
        rotate(-25deg)
        scale(.75);

}


/* =================================================
   SUNDLE
   右上から入る
================================================= */

.gallery-sundle{

    width:430px;
    height:430px;

    right:5vw;
    top:8vh;

    transform:
        translate(120vw,-70vh)
        rotate(28deg)
        scale(.75);

}


/* =================================================
   MOTAN
   左下から入る
================================================= */

.gallery-motan{

    width:450px;
    height:450px;

    left:15vw;
    bottom:5vh;

    transform:
        translate(-120vw,80vh)
        rotate(24deg)
        scale(.75);

}


/* =================================================
   KURAGEMAN
   右下から入る
================================================= */

.gallery-kurageman{

    width:430px;
    height:430px;

    right:15vw;
    bottom:6vh;

    transform:
        translate(120vw,80vh)
        rotate(-24deg)
        scale(.75);

}


/* =================================================
   Instagram Hover
================================================= */

body.instagram-active .instagram-gallery img{

    opacity:1;

}


/* -------------------------
   SUPAIDER
------------------------- */

body.instagram-active .gallery-supaider{

    transform:
        translate(0,0)
        rotate(-9deg)
        scale(1);

    transition-delay:.00s;

}


/* -------------------------
   SUNDLE
------------------------- */

body.instagram-active .gallery-sundle{

    transform:
        translate(0,0)
        rotate(8deg)
        scale(1);

    transition-delay:.08s;

}


/* -------------------------
   MOTAN
------------------------- */

body.instagram-active .gallery-motan{

    transform:
        translate(0,0)
        rotate(6deg)
        scale(1);

    transition-delay:.16s;

}


/* -------------------------
   KURAGEMAN
------------------------- */

body.instagram-active .gallery-kurageman{

    transform:
        translate(0,0)
        rotate(-7deg)
        scale(1);

    transition-delay:.24s;

}


/* =================================================
   note演出
================================================= */

.note-title{

    position:fixed;

    top:-150px;
    left:-100px;

    font-size:130px;

    font-weight:300;

    letter-spacing:.12em;

    color:#fff;

    opacity:0;

    transition:
    all 1s cubic-bezier(.22,1,.36,1);

    z-index:10000;

}


.note-message{

    position:fixed;

    right:-100px;
    bottom:-300px;

    width:520px;

    font-size:42px;

    font-weight:200;

    line-height:1.8;

    letter-spacing:.12em;

    color:#fff;

    opacity:0;

    transition:
    all 1.2s cubic-bezier(.22,1,.36,1);

    z-index:10000;

}


/* =================================================
   mail演出
================================================= */

.mail-message{

    position:fixed;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    font-size:42px;

    font-weight:300;

    letter-spacing:.1em;

    color:#fff;

    opacity:0;

    transition:.8s ease;

    z-index:10000;

}


.copy-message{

    position:fixed;

    top:55%;
    left:50%;

    transform:translateX(-50%);

    font-size:16px;

    letter-spacing:.2em;

    color:#ff0088;

    opacity:0;

    transition:.3s ease;

    z-index:10001;

}


.copy-message.show{

    opacity:1;

}


/* =================================================
   note / mail 背景
================================================= */

body.note-active{

    background:#000;
    color:#fff;

}


body.mail-active{

    background:#000;
    color:#fff;

}


body.note-active nav a,
body.note-active .contact-links a,
body.mail-active nav a,
body.mail-active .contact-links a{

    color:#fff;

}


/* =================================================
   note表示
================================================= */

body.note-active .note-title{

    top:40px;
    left:40px;

    opacity:.85;

}


body.note-active .note-message{

    right:80px;
    bottom:60px;

    opacity:1;

}


/* =================================================
   mail表示
================================================= */

body.mail-active .mail-message{

    opacity:1;

}


/* =================================================
   スマホ
================================================= */

@media(max-width:768px){

    nav{

        top:24px;
        right:24px;
        gap:14px;

    }


    nav a{

        font-size:16px;

    }


    .contact-links{

        left:24px;
        bottom:24px;
        gap:18px;

    }


    .contact-links a{

        font-size:56px;

    }


    .note-title{

        font-size:70px;

    }


    .note-message{

        width:300px;
        font-size:28px;
        right:20px;

    }


    .mail-message{

        font-size:26px;

    }


    body.note-active .note-title{

        top:30px;
        left:20px;

    }


    body.note-active .note-message{

        right:20px;
        bottom:40px;

    }


    /* =================================================
       Instagram画像
    ================================================= */

    .gallery-supaider{

        width:230px;
        height:230px;

        left:3vw;
        top:10vh;

    }


    .gallery-sundle{

        width:190px;
        height:190px;

        right:3vw;
        top:12vh;

    }


    .gallery-motan{

        width:200px;
        height:200px;

        left:3vw;
        bottom:18vh;

    }


    .gallery-kurageman{

        width:190px;
        height:190px;

        right:3vw;
        bottom:18vh;

    }

}

</style>

</head>


<body>


<!-- =================================================
     Navigation
================================================= -->

<nav>

    <a href="design.html">
        design
    </a>

    <a href="art.html">
        art
    </a>

    <a href="profile.html">
        profile
    </a>

    <a href="contact.html" class="active">
        contact
    </a>

</nav>



<!-- =================================================
     Instagram Images
================================================= -->

<div class="instagram-gallery">

    <img
        src="./supaider.png"
        class="gallery-supaider"
        alt=""
    >

    <img
        src="./sundle.png"
        class="gallery-sundle"
        alt=""
    >

    <img
        src="./motan.png"
        class="gallery-motan"
        alt=""
    >

    <img
        src="./kurageman.png"
        class="gallery-kurageman"
        alt=""
    >

</div>



<!-- =================================================
     Contact Links
================================================= -->

<div class="contact-links">


    <a class="mail-link">
        mail
    </a>


    <a
        class="note-link"
        href="https://note.com/motan_8823"
        target="_blank"
        rel="noopener noreferrer">

        note

    </a>


    <a
        class="instagram-link"
        href="https://www.instagram.com/motan_8823/"
        target="_blank"
        rel="noopener noreferrer">

        instagram

    </a>


</div>



<!-- =================================================
     Note
================================================= -->

<div class="note-title">

    森 颯詩

</div>


<div class="note-message">

    周りを<br>
    経済的にも<br>
    感情的にも<br>
    豊かにできる人が、<br>
    面白い人だと<br>
    思っています。

</div>



<!-- =================================================
     Mail
================================================= -->

<div class="mail-message">

    soshi.tennis@gmail.com

</div>


<div class="copy-message">

    copied

</div>



<script>


/* =================================================
   Elements
================================================= */

const noteLink =
    document.querySelector(".note-link");

const mailLink =
    document.querySelector(".mail-link");

const instagramLink =
    document.querySelector(".instagram-link");

const copyMessage =
    document.querySelector(".copy-message");



/* =================================================
   note
================================================= */

noteLink.addEventListener("mouseenter",()=>{

    document.body.classList.add("note-active");

});


noteLink.addEventListener("mouseleave",()=>{

    document.body.classList.remove("note-active");

});



/* =================================================
   mail
================================================= */

mailLink.addEventListener("mouseenter",()=>{

    document.body.classList.add("mail-active");

});


mailLink.addEventListener("mouseleave",()=>{

    document.body.classList.remove("mail-active");

});


mailLink.addEventListener("click",()=>{

    navigator.clipboard.writeText(
        "soshi.tennis@gmail.com"
    );

    copyMessage.classList.add("show");


    setTimeout(()=>{

        copyMessage.classList.remove("show");

    },1500);

});



/* =================================================
   Instagram
================================================= */

instagramLink.addEventListener("mouseenter",()=>{

    document.body.classList.add("instagram-active");

});


instagramLink.addEventListener("mouseleave",()=>{

    document.body.classList.remove("instagram-active");

});


</script>


</body>

</html>
